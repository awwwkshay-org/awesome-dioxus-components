[package]
name = "adico-example-basic-ssr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Kept explicit (matching the workspace's pinned "=0.7.9" and feature set)
# rather than `dioxus.workspace = true`, so the installer can verify and edit
# this declaration exactly as it would in a normal external Dioxus project.
dioxus = { version = "=0.7.9", features = ["fullstack", "router"] }
adico-primitives = { version = "=0.1.0", features = ["web"] }
palette = "0.7.6"
time = "=0.3.44"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
server = ["dioxus/server"]
