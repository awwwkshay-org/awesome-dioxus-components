[package]
name = "adico-example-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Kept explicit (matching the workspace's pinned "=0.7.9") rather than
# `dioxus.workspace = true`, so the installer can verify and edit this
# declaration exactly as it would in a normal external Dioxus project.
dioxus = { version = "=0.7.9" }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
server = ["dioxus/server"]
