[package]
name = "adico-example-basic-spa"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Keep this consumer-style fixture explicit rather than inheriting the
# workspace's fullstack development feature set. The installer can then verify
# the declaration exactly as it would in a normal external Dioxus project.
dioxus = { version = "=0.7.9", default-features = false, features = ["web", "launch", "macro", "html", "signals", "hooks", "asset", "document"] }
adico-primitives = { version = "=0.1.0", features = ["web"] }
# dioxus-web 0.7.10's history integration calls web_sys::Window::location(),
# which needs this feature enabled somewhere in the dependency graph for
# Cargo's feature unification to make it available; dioxus-web itself does
# not declare it. https://github.com/DioxusLabs/dioxus upstream issue candidate.
web-sys = { version = "=0.3.104", features = ["Location"] }
palette = "0.7.6"
time = "=0.3.44"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
server = ["dioxus/server"]
