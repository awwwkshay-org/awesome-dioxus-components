[workspace]
members = [
    "apps/docs",
    "apps/playground",
    "examples/basic-spa",
    "examples/basic-ssr",
    "packages/adico-cli",
    "packages/adico-primitives",
    "packages/adico-registry-core",
    "packages/adico-test-utils",
    "packages/adico-xtask",
    "packages/shared",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
dioxus = { version = "=0.7.9", features = ["fullstack", "router"] }
dirs = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate", "macros"] }
thiserror = "2"
toml_edit = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "js"] }
url = "2"

# Local examples and installation fixtures exercise the released dependency
# declaration emitted by `adico add` before `adico-primitives` is published.
# This only overrides the source in this repository's development workspace;
# consumer manifests still contain the normal crates.io requirement.
[patch.crates-io]
adico-primitives = { path = "packages/adico-primitives" }
