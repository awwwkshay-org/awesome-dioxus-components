[workspace]
members = [
    "apps/web",
    "examples/basic-spa",
    "examples/basic-ssr",
    "packages/adico-cli",
    "packages/adico-primitives",
    "packages/adico-registry-core",
    "packages/adico-test-utils",
    "packages/adico-xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/awwwkshay-org/awesome-dioxus-components"
homepage = "https://adico.awwwkshay.com"
documentation = "https://adico.awwwkshay.com/docs"

[workspace.dependencies]
dioxus = { version = "=0.7.9", features = ["fullstack", "router"] }
dirs = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml_edit = "0.22"
tracing = "0.1"
url = "2"

# Local examples and installation fixtures exercise the released dependency
# declaration emitted by `adico add` before `adico-primitives` is published.
# This only overrides the source in this repository's development workspace;
# consumer manifests still contain the normal crates.io requirement.
[patch.crates-io]
adico-primitives = { path = "packages/adico-primitives" }
