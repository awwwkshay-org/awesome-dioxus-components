name: Release adico

# Tag-triggered CLI release: builds native `adico` binaries, publishes GitHub
# Release assets, and updates the Homebrew tap formula. Does not publish to
# crates.io (tracked separately).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}

      - name: Verify tag matches the crate version
        shell: bash
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "adico-cli") | .version')
          test "${GITHUB_REF_NAME}" = "v${crate_version}"

      - name: Check the embedded registry payload isn't stale
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo run -p adico-xtask -- registry build --check

      - name: Build adico
        run: cargo build --locked --release --package adico-cli --bin adico --target ${{ matrix.target }}

      - name: Package binary and checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="adico-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          staging="${archive%.tar.gz}"
          mkdir "${staging}"
          cp "target/${{ matrix.target }}/release/adico" "${staging}/adico"
          tar -czf "${archive}" -C "${staging}" adico
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - name: Package binary and checksum (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          archive="adico-${GITHUB_REF_NAME}-${{ matrix.target }}.zip"
          staging="${archive%.zip}"
          mkdir "${staging}"
          cp "target/${{ matrix.target }}/release/adico.exe" "${staging}/adico.exe"
          7z a "${archive}" "./${staging}/adico.exe"
          sha256sum "${archive}" > "${archive}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: adico-${{ matrix.target }}
          path: |
            adico-*.tar.gz
            adico-*.tar.gz.sha256
            adico-*.zip
            adico-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: adico-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "adico ${GITHUB_REF_NAME}"

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify Homebrew tap token is configured
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if test -z "${TAP_TOKEN}"; then
            echo "::error::Add a HOMEBREW_TAP_TOKEN repository secret with Contents: read and write access to awwwkshay-org/homebrew-tap"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: source
      - uses: actions/checkout@v6
        with:
          repository: awwwkshay-org/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Download binary checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'adico-*.tar.gz.sha256' \
            --dir checksums
      - name: Generate and validate formula
        shell: bash
        run: |
          python3 source/.github/scripts/render_homebrew_formula.py \
            --version "${GITHUB_REF_NAME#v}" \
            --checksums-dir checksums \
            --output tap/Formula/adico.rb
          ruby -c tap/Formula/adico.rb
      - name: Publish formula
        working-directory: tap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/adico.rb
          if git diff --cached --quiet; then
            echo "Formula is already current"
            exit 0
          fi
          git commit -m "Update adico to ${GITHUB_REF_NAME}"
          git push
