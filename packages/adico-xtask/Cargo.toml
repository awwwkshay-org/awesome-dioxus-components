[package]
name = "adico-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Repository automation for Awesome Dioxus Components"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
adico-registry-core = { path = "../adico-registry-core" }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
