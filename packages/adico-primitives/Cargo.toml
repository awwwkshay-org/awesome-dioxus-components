[package]
name = "adico-primitives"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Owned headless primitives for Awesome Dioxus Components"

[dependencies]
# The runtime must not inherit the workspace's fullstack feature selection.
# Installed components select their Dioxus platform in the consumer application;
# primitives only need the common composition, signal, and hook APIs.
dioxus = { version = "=0.7.9", default-features = false, features = ["asset", "hooks", "html", "macro", "mounted", "signals"] }
dioxus-core = "0.7.9"
dioxus-document = "0.7.9"
dioxus-icons = "=0.1.0"
tracing = { workspace = true }
time = { version = "0.3.44", features = ["std", "macros", "parsing", "local-offset"] }
num-integer = "0.1.46"
palette = "0.7.6"
# Cross-platform OS/browser theme-preference detection for `theme_mode`'s
# `ThemeMode::System` resolution on `web` and `native` (macOS/Windows/
# Linux+BSD via XDG Desktop Portal/WASM from one API). See design.md §7b.
dark-light = "3.0.0"

[dev-dependencies]
# Only used by calendar/date_picker unit tests to render static HTML for
# assertions; matches upstream's own dev-dependency.
dioxus-ssr = "0.7.0"
dioxus-html = { version = "=0.7.9", features = ["serialize"] }

[target.'cfg(target_family = "wasm")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["time"] }

[features]
default = []
# Enables browser DOM interop for WebAssembly consumers.
# `time`'s `local-offset` needs the browser's timezone via wasm-bindgen when
# targeting wasm; native (see the `native` feature) resolves it through the OS.
web = ["time/wasm-bindgen"]
# Enables WebView DOM interop for Dioxus desktop and mobile (Android/iOS)
# consumers. Named `native` rather than `desktop` because Dioxus's desktop and
# mobile renderers both embed the same platform WebView family (wry/tao) and
# share identical interop needs, unlike a true native-widget renderer; see
# design.md §8a.
native = []
# Exposes narrowly scoped test adapters for `adico-test-utils`; not required by consumers.
test-utils = []
