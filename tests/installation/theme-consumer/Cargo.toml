[package]
name = "adico-theme-consumer"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
# A browser fixture explicitly selects the Dioxus web runtime. Runtime crates
# must not make a consumer inherit fullstack or development-only features.
dioxus = { version = "=0.7.9", default-features = false, features = ["web", "launch", "macro", "html", "signals", "hooks", "asset", "document"] }
adico-primitives = { version = "=0.1.0", features = ["web"] }
# dioxus-web 0.7.10's history integration calls web_sys::Window::location(),
# which needs this feature enabled somewhere in the dependency graph for
# Cargo's feature unification to make it available; dioxus-web itself does
# not declare it (matches examples/basic-spa's own workaround).
web-sys = { version = "=0.3.104", features = ["Location"] }

[patch.crates-io]
adico-primitives = { path = "../../../packages/adico-primitives" }
