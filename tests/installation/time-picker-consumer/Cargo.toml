[package]
name = "adico-time-picker-consumer"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
# A browser fixture explicitly selects the Dioxus web runtime. Runtime crates
# must not make a consumer inherit fullstack or development-only features.
# `document` is load-bearing here, unlike in the other installation fixtures:
# this is the first one that exercises a popover, and `Positioner` places an
# anchored popup through `dioxus_document::eval`, whose runtime provider
# `dioxus-web` only registers when its own `document` feature is on. Without
# it the popup opens logically (correct ARIA, correct `data-state=open`) but
# stays `visibility: hidden` forever — verified live in this fixture.
dioxus = { version = "=0.7.9", default-features = false, features = ["web", "launch", "macro", "html", "signals", "hooks", "asset", "document"] }
# Pinned to the version the workspace itself resolves. Left unpinned, this
# fixture picks up dioxus-web 0.7.10, which fails to compile against the rest
# of the 0.7.9 dioxus crates once `document` is enabled.
dioxus-web = "=0.7.9"
adico-primitives = { version = "=0.1.0", features = ["web"] }
time = "=0.3.44"

[patch.crates-io]
adico-primitives = { path = "../../../packages/adico-primitives" }
